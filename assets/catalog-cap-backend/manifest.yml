---
applications:
  - name: ssc-catalog-cap-backend
    memory: 1024M
    disk_quota: 1024M
    instances: 1
    buildpacks:
      - nodejs_buildpack
    command: npm start
    health-check-type: http
    health-check-http-endpoint: /health
    health-check-invocation-timeout: 10
    env:
      NODE_ENV: production
      # Add your SSC credentials here:
      # SSC_BASE_URL: https://your-ssc-instance.com
      # SSC_API_KEY: your-api-key
    services:
      - ssc-catalog-xsuaa
      - ssc-catalog-db
