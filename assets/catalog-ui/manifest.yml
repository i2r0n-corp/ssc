---
applications:
  - name: ssc-catalog-ui
    memory: 256M
    disk_quota: 512M
    instances: 1
    buildpacks:
      - nodejs_buildpack
    command: npm start
    health-check-type: http
    health-check-http-endpoint: /
    env:
      NODE_ENV: production
      destinations: >
        [{"name":"ssc-catalog-backend","url":"https://ssc-catalog-cap-backend.cfapps.us10-001.hana.ondemand.com","forwardAuthToken":true}]
    services:
      - ssc-catalog-xsuaa
