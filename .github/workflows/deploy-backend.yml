name: Deploy CAP Backend to CF

on:
  push:
    branches: [main]
    paths:
      - 'assets/catalog-cap-backend/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install CF CLI
        run: |
          wget -q -O - https://packages.cloudfoundry.org/debian/cli.cloudfoundry.org.key | sudo apt-key add -
          echo "deb https://packages.cloudfoundry.org/debian stable main" | sudo tee /etc/apt/sources.list.d/cloudfoundry-cli.list
          sudo apt-get update && sudo apt-get install -y cf8-cli

      - name: Login to Cloud Foundry
        run: |
          cf api https://api.cf.us10-001.hana.ondemand.com
          cf auth "${{ secrets.CF_USERNAME }}" "${{ secrets.CF_PASSWORD }}"
          cf target -o d980443atrial -s dev

      - name: Check what changed
        id: changes
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD -- assets/catalog-cap-backend/)
          echo "changed files: $CHANGED"

          # Full redeploy needed if package.json, manifest.yml or server.js changed
          if echo "$CHANGED" | grep -qE "(package\.json|manifest\.yml|server\.js|Procfile)"; then
            echo "mode=full" >> $GITHUB_OUTPUT
          else
            echo "mode=restart" >> $GITHUB_OUTPUT
          fi

      - name: Full deploy (package.json or manifest changed)
        if: steps.changes.outputs.mode == 'full'
        working-directory: assets/catalog-cap-backend
        run: |
          cf push
          cf set-env ssc-catalog-cap-backend SSC_AUTH_URL "${{ secrets.SSC_AUTH_URL }}"
          cf set-env ssc-catalog-cap-backend SSC_CLIENT_ID "${{ secrets.SSC_CLIENT_ID }}"
          cf set-env ssc-catalog-cap-backend SSC_CLIENT_SECRET "${{ secrets.SSC_CLIENT_SECRET }}"
          cf set-env ssc-catalog-cap-backend SSC_CATALOG_BASE_URL "${{ secrets.SSC_CATALOG_BASE_URL }}"
          cf restart ssc-catalog-cap-backend

      - name: Quick restart (only logic files changed)
        if: steps.changes.outputs.mode == 'restart'
        run: |
          APP_GUID=$(cf app ssc-catalog-cap-backend --guid)
          # Copy changed files via CF SSH
          for FILE in $(git diff --name-only HEAD~1 HEAD -- assets/catalog-cap-backend/ | sed 's|assets/catalog-cap-backend/||'); do
            echo "Uploading $FILE..."
            cf ssh ssc-catalog-cap-backend -c "cat > /home/vcap/app/$FILE" < assets/catalog-cap-backend/$FILE
          done
          cf restart ssc-catalog-cap-backend
