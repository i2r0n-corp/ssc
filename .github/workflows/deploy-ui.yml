name: Deploy UI to CF

on:
  push:
    branches: [main]
    paths:
      - 'assets/catalog-ui/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install CF CLI
        run: |
          wget -q -O - https://packages.cloudfoundry.org/debian/cli.cloudfoundry.org.key | sudo apt-key add -
          echo "deb https://packages.cloudfoundry.org/debian stable main" | sudo tee /etc/apt/sources.list.d/cloudfoundry-cli.list
          sudo apt-get update && sudo apt-get install -y cf8-cli

      - name: Login to Cloud Foundry
        run: |
          cf api https://api.cf.us10-001.hana.ondemand.com
          cf auth "${{ secrets.CF_USERNAME }}" "${{ secrets.CF_PASSWORD }}"
          cf target -o d980443atrial -s dev

      - name: Check what changed
        id: changes
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD -- assets/catalog-ui/)
          echo "changed files: $CHANGED"

          if echo "$CHANGED" | grep -qE "(package\.json|manifest\.yml|Procfile|server\.js)"; then
            echo "mode=full" >> $GITHUB_OUTPUT
          else
            echo "mode=restart" >> $GITHUB_OUTPUT
          fi

      - name: Full deploy (manifest or package.json changed)
        if: steps.changes.outputs.mode == 'full'
        working-directory: assets/catalog-ui
        run: cf push

      - name: Quick file update (only static files changed)
        if: steps.changes.outputs.mode == 'restart'
        run: |
          for FILE in $(git diff --name-only HEAD~1 HEAD -- assets/catalog-ui/ | sed 's|assets/catalog-ui/||'); do
            echo "Uploading $FILE..."
            cf ssh ssc-catalog-ui -c "cat > /home/vcap/app/$FILE" < assets/catalog-ui/$FILE
          done
          cf restart ssc-catalog-ui
