name: Sync Excel Enrichment
# ⚠️ This workflow is DISABLED — the sync script reads from a local
# OneDrive-synced folder on the user's machine and MUST run locally
# via Windows Task Scheduler, not on GitHub Actions runners.
# Schedule it locally using the instructions in:
# assets/catalog-cap-backend/scripts/MANIFEST-SYNC-SETUP.md

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type SKIP to acknowledge this runs locally only'
        required: true
        default: 'SKIP'

jobs:
  skip:
    runs-on: ubuntu-latest
    steps:
      - name: Notice
        run: |
          echo "⚠️  This sync reads from a local OneDrive folder on your machine."
          echo "⚠️  It cannot run on GitHub Actions."
          echo "✅  Schedule it via Windows Task Scheduler instead."
          echo "✅  See: assets/catalog-cap-backend/scripts/MANIFEST-SYNC-SETUP.md"
